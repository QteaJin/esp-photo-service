; ESP32-S3 CAM (OV3660 / OV5640) - порт Pi-Zero-Server (ветка main)
; Под плату N16R8 (16 MB flash, 8 MB OPI PSRAM). Для других вариантов поменяйте memory_type / flash_size.
;
; Основное окружение - загрузка по USB (по умолчанию, `pio run -t upload` и кнопка Upload в VS Code).
; Загрузка по Wi-Fi: `pio run -e esp32-s3-cam-ota -t upload` (пароль берётся из include/secrets.h).
[platformio]
default_envs = esp32-s3-cam

[env:esp32-s3-cam]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    tzapu/WiFiManager@^2.0.17

; pre: версия прошивки (FW_VERSION). post: пароль OTA и публикация firmware.bin + version.json
extra_scripts =
    pre:scripts/pre_version.py
    post:scripts/post_ota.py

; Папка, куда после каждой сборки кладутся firmware.bin и version.json для сервера прошивок
custom_fw_publish_dir = firmware_out

; Загрузка по Wi-Fi: то же самое, только по сети. Имя в upload_port должно совпадать с OTA_HOSTNAME
; в include/secrets.h. Если .local не находится, впишите IP платы (виден на вкладке Camera).
[env:esp32-s3-cam-ota]
extends = env:esp32-s3-cam
upload_protocol = espota
upload_port = esp32cam.local
