; ESP32-S3 CAM (OV5640) - порт Pi-Zero-Server (ветка main)
; Под плату N16R8 (16 MB flash, 8 MB OPI PSRAM). Для других вариантов поменяйте memory_type / flash_size.
[env:esp32-s3-cam]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    tzapu/WiFiManager@^2.0.17
